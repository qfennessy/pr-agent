name: Upstream provenance

# pull_request_target loads this workflow from the protected base branch. The job
# must never check out or execute pull-request-authored code.
on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read

jobs:
  verify-upstream-pin:
    name: Upstream provenance
    runs-on: ubuntu-latest
    steps:
      - name: Classify pull request
        id: classify
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$HEAD_REF" == sync/upstream-* ]]; then
            echo "is_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_sync=false" >> "$GITHUB_OUTPUT"
            echo "Ordinary pull request; no upstream pin to verify."
          fi

      - name: Check out protected verifier
        if: steps.classify.outputs.is_sync == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Fetch candidate and upstream history
        if: steps.classify.outputs.is_sync == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch origin "+refs/pull/${PR_NUMBER}/head:refs/upstream-sync/candidate" --no-tags --quiet
          if [[ "$(git rev-parse refs/upstream-sync/candidate)" != "$HEAD_SHA" ]]; then
            echo "::error::Fetched pull-request head does not match the event head SHA."
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$BASE_SHA" ]]; then
            echo "::error::Protected verifier checkout does not match the event base SHA."
            exit 1
          fi
          git fetch https://github.com/The-PR-Agent/pr-agent.git \
            "+refs/heads/main:refs/upstream-sync/upstream-main" --no-tags --quiet

      - name: Verify immutable upstream candidate
        if: steps.classify.outputs.is_sync == 'true'
        env:
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          python -m pr_agent.upstream_provenance \
            --repository . \
            --head-ref "$HEAD_REF" \
            --head-repo "$HEAD_REPO" \
            --head-sha "$HEAD_SHA" \
            --base-repo "$BASE_REPO" \
            --base-sha "$BASE_SHA" \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --upstream-main-sha "$(git rev-parse refs/upstream-sync/upstream-main)"
