# Fork-only workflow (qfennessy/pr-agent). Opens a review PR bound to an
# immutable upstream SHA. When Git can combine the fork and upstream cleanly,
# the PR head is a constrained two-parent integration merge; otherwise the raw
# pin is published with instructions for producing that merge after resolving
# conflicts. See FORK-MAINTENANCE.md.
name: Upstream sync PR

on:
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: 'Upstream SHA to pin (default: current upstream/main)'
        required: false
        type: string
  schedule:
    - cron: '17 12 * * 1' # Mondays 12:17 UTC

permissions:
  contents: read
  pull-requests: write

jobs:
  open-sync-pr:
    # Guard: never run if this file ever lands upstream or in another fork.
    if: github.repository == 'qfennessy/pr-agent'
    runs-on: ubuntu-latest
    environment: upstream-sync
    steps:
      - name: Require importer deploy key
        env:
          UPSTREAM_SYNC_DEPLOY_KEY: ${{ secrets.UPSTREAM_SYNC_DEPLOY_KEY }}
        run: |
          if [ -z "${UPSTREAM_SYNC_DEPLOY_KEY:-}" ]; then
            echo "::error::UPSTREAM_SYNC_DEPLOY_KEY is not configured. See FORK-MAINTENANCE.md."
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.UPSTREAM_SYNC_DEPLOY_KEY }}

      - name: Resolve and pin upstream SHA
        id: pin
        env:
          # Pass through env, never interpolate ${{ }} into run: - expression injection guard.
          INPUT_SHA: ${{ inputs.upstream_sha }}
        run: |
          git remote add upstream https://github.com/The-PR-Agent/pr-agent.git
          git fetch upstream main --quiet
          RAW="$INPUT_SHA"
          [ -z "$RAW" ] && RAW="upstream/main"
          # Canonicalize to a hex commit id before anything downstream sees it: the raw
          # dispatch input must never reach a later run: script as a step output.
          SHA=$(git rev-parse --verify --quiet "${RAW}^{commit}") || {
            echo "Not a commit: $RAW" >&2; exit 1; }
          case "$SHA" in
            [0-9a-f][0-9a-f]*) [ ${#SHA} -eq 40 ] || { echo "Bad SHA: $SHA" >&2; exit 1; } ;;
            *) echo "Bad SHA: $SHA" >&2; exit 1 ;;
          esac
          # Refuse commits that are not actually on upstream/main.
          git merge-base --is-ancestor "$SHA" upstream/main
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:8}" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$SHA" origin/main; then
            echo "Already contains $SHA - nothing to sync."
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if a sync PR is already open
        id: existing
        if: steps.pin.outputs.up_to_date == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN=$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("sync/upstream-"))] | length')
          echo "open=$OPEN" >> "$GITHUB_OUTPUT"
          [ "$OPEN" != "0" ] && echo "An open sync PR exists - review or close it first." || true

      - name: Create pinned sync branch and review PR
        if: steps.pin.outputs.up_to_date == 'false' && steps.existing.outputs.open == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          # Same guard as the pin step: step outputs go through env, never ${{ }} in run:.
          SHA: ${{ steps.pin.outputs.sha }}
          SHORT: ${{ steps.pin.outputs.short }}
        run: |
          set -euo pipefail
          BRANCH="sync/upstream-$(date -u +%Y%m%d)-${SHORT}"
          BASELINE=$(git rev-parse origin/main)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --detach "$BASELINE"
          if git merge --no-ff --no-edit "$SHA"; then
            TOPOLOGY="resolved merge"
            RESOLUTION_REQUIRED=false
          else
            git merge --abort
            git switch --detach "$SHA"
            TOPOLOGY="raw pin (manual conflict resolution required)"
            RESOLUTION_REQUIRED=true
          fi
          git branch "$BRANCH" HEAD
          git push origin "$BRANCH"

          BASE=$(git merge-base "$BASELINE" "$SHA")
          {
            echo "Pinned upstream sync: \`The-PR-Agent/pr-agent@${SHA}\`"
            echo "Fork integration baseline: \`qfennessy/pr-agent@${BASELINE}\`"
            echo "Candidate topology: \`${TOPOLOGY}\`"
            echo
            echo "New upstream commits:"
            echo '```'
            git log --oneline "$BASE..$SHA"
            echo '```'
            echo
            echo "Diffstat:"
            echo '```'
            git diff --stat "$BASE" "$SHA" | tail -25
            echo '```'
            SENSITIVE=$(git diff --name-only "$BASE" "$SHA" -- \
              '.github/workflows' 'requirements*.txt' 'pyproject.toml' \
              'pr_agent/settings' 'pr_agent/config_loader.py' \
              'pr_agent/secret_providers' 'docker' || true)
            echo
            if [ -n "$SENSITIVE" ]; then
              echo "### High-scrutiny paths changed - review these first"
              echo "$SENSITIVE" | sed 's/^/- `/' | sed 's/$/`/'
            else
              echo "No high-scrutiny paths (workflows, deps, prompts, secrets/config, docker) changed."
            fi
            echo
            if [ "$RESOLUTION_REQUIRED" = true ]; then
              echo "### Conflict resolution required"
              echo
              echo "The immutable upstream pin conflicts with the fork baseline. Build the reviewed candidate"
              echo "in a dedicated worktree; do not add commits before or after the integration merge:"
              echo '```bash'
              echo "git fetch origin main \"$BRANCH\""
              echo "git fetch https://github.com/The-PR-Agent/pr-agent.git main"
              echo "git switch --detach \"$BASELINE\""
              echo "git merge --no-ff --no-commit \"$SHA\""
              echo "# Resolve conflicts, then stage only the intended resolutions."
              echo "git add <resolved-paths>"
              echo "git commit -m \"sync: integrate upstream @ $SHORT\""
              echo "git push --force-with-lease=refs/heads/$BRANCH:$SHA origin HEAD:refs/heads/$BRANCH"
              echo '```'
              echo
              echo "If \`main\` moves and the PR conflicts again, rebuild the same two-parent candidate on the"
              echo "new baseline and update the single \`Fork integration baseline\` line in this body."
              echo
            fi
            echo "Review checklist: run /review against this PR before merging;"
            echo "wait for Upstream provenance; after merging, verify the PR candidate's parent topology"
            echo "and confirm that one candidate parent is the pinned upstream SHA \`$SHA\`."
            echo
            echo "_Generated by the upstream-sync workflow._"
          } > body.md

          gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" \
            -f base=main \
            -f head="$BRANCH" \
            -f title="sync: upstream @ ${SHORT}" \
            -F body=@body.md \
            --jq .html_url
