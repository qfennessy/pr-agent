# NOTE: This file is consumed by Qodo's "free for open source" agent
# (the `qodo-free-for-open-source-projects` bot) — a separate, hosted, closed-source
# service. It is NOT read by the open-source pr-agent in this repository; some keys
# below (e.g. the [review_agent] section) only exist in that hosted agent.

[pr_reviewer]
enable_review_labels_effort = true
enable_auto_approval = true
# Keep candidate verification opt-in while benchmark evidence is gathered.
enable_candidate_verification = false
candidate_verification_consume_specialist_prioritization = false
candidate_verification_model = ""
candidate_verification_deployment = ""
candidate_verification_fallback_models = []
candidate_verification_fallback_deployments = []
candidate_verification_max_output_tokens = 0
candidate_verification_max_model_calls = 1
candidate_verification_max_candidates = 3
candidate_verification_max_sensitive_candidates = 6
candidate_verification_max_files = 6
candidate_verification_max_lines_per_file = 160
candidate_verification_max_total_lines = 600
candidate_verification_max_context_tokens = 6000
candidate_verification_timeout_seconds = 10
candidate_verification_sensitive_path_globs = []
# Frontier adjudication remains off until the production replay gates pass.
enable_frontier_adjudication = false
frontier_adjudication_model = ""
frontier_adjudication_deployment = ""
frontier_adjudication_provider = ""
frontier_adjudication_revision = ""
frontier_adjudication_fallback_models = []
frontier_adjudication_fallback_deployments = []
frontier_adjudication_fallback_providers = []
frontier_adjudication_fallback_revisions = []
frontier_adjudication_timeout_seconds = 120
frontier_adjudication_model_timeout_seconds = 60
frontier_adjudication_model_retries = 1
frontier_adjudication_provider_retries = 0
frontier_adjudication_max_output_tokens = 2048
frontier_adjudication_minimum_confidence = 0.0
frontier_adjudication_max_calls = 3

[review_thread_lifecycle]
# Keep stable GitHub review-thread publication disabled until the #27 rollout gates pass.
enabled = false
obsolete_thread_policy = "keep"

[github_app]
pr_commands = [
    "/describe --pr_description.publish_description_as_comment=true",
    "/improve",
    "/agentic_review"
]

handle_push_trigger = true
push_commands = [
    "/improve",
    "/agentic_review"
]

[review_agent]
enabled = true
publish_output = true
demand_self_review = true
approve_pr_on_self_review = true

[local_pair_review]
# Keep this user-facing snapshot configuration mirrored with configuration.toml.
policy_version = "local-pair-review-v1"
events = ["file_save", "worktree_idle", "pre_commit"]
excluded_paths = []
max_file_bytes = 1000000
max_snapshot_bytes = 5000000
max_path_discovery_bytes = 1000000
cache_enabled = true
cache_max_entries = 50
file_save_debounce_ms = 1500
worktree_idle_seconds = 15
max_concurrency = 2
cancel_stale_snapshots = true

[checkpoint_evaluation]
# Keep this disabled evaluation configuration mirrored with configuration.toml.
enabled = false
allow_paid_execution = false
shadow_journal_enabled = false
publish_output = false
paid_cost_cap_usd = 0.0
shadow_journal_path = ""
shadow_journal_max_queue_entries = 256
