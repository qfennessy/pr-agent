# NOTE: This file is consumed by Qodo's "free for open source" agent
# (the `qodo-free-for-open-source-projects` bot) — a separate, hosted, closed-source
# service. It is NOT read by the open-source pr-agent in this repository; some keys
# below (e.g. the [review_agent] section) only exist in that hosted agent.

[pr_reviewer]
enable_review_labels_effort = true
enable_auto_approval = true
# Keep candidate verification opt-in while benchmark evidence is gathered.
enable_candidate_verification = false
candidate_verification_model = ""
candidate_verification_max_model_calls = 1
candidate_verification_max_candidates = 3
candidate_verification_max_files = 6
candidate_verification_max_lines_per_file = 160
candidate_verification_max_total_lines = 600
candidate_verification_max_context_tokens = 6000
candidate_verification_timeout_seconds = 10
candidate_verification_sensitive_path_globs = []

[github_app]
pr_commands = [
    "/describe --pr_description.publish_description_as_comment=true",
    "/improve",
    "/agentic_review"
]

handle_push_trigger = true
push_commands = [
    "/improve",
    "/agentic_review"
]

[review_agent]
enabled = true
publish_output = true
demand_self_review = true
approve_pr_on_self_review = true
