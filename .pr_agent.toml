# NOTE: This file is consumed by Qodo's "free for open source" agent
# (the `qodo-free-for-open-source-projects` bot) — a separate, hosted, closed-source
# service. It is NOT read by the open-source pr-agent in this repository; some keys
# below (e.g. the [review_agent] section) only exist in that hosted agent.

[pr_reviewer]
enable_review_labels_effort = true
enable_auto_approval = true

[github_app]
pr_commands = [
    "/describe --pr_description.publish_description_as_comment=true",
    "/improve",
    "/agentic_review"
]

handle_push_trigger = true
push_commands = [
    "/improve",
    "/agentic_review"
]

[review_agent]
enabled = true
publish_output = true
demand_self_review = true
approve_pr_on_self_review = true

[local_pair_review]
# Keep this user-facing snapshot configuration mirrored with configuration.toml.
policy_version = "local-pair-review-v1"
events = ["file_save", "worktree_idle", "pre_commit"]
excluded_paths = []
max_file_bytes = 1000000
max_snapshot_bytes = 5000000
cache_enabled = true
cache_max_entries = 50
file_save_debounce_ms = 1500
worktree_idle_seconds = 15
max_concurrency = 2
cancel_stale_snapshots = true
